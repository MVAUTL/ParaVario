name: Publier ParaVario

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paravario-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Installer le SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compiler et signer l’APK
        env:
          KEYSTORE_BASE64: ${{ secrets.PARAVARIO_KEYSTORE }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configurez le secret PARAVARIO_KEYSTORE}"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          android="$ANDROID_HOME/platforms/android-35/android.jar"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$stage/signing.jks"
          mkdir "$stage/classes"
          version=$((GITHUB_RUN_NUMBER + 1))
          "$tools/aapt2" compile --dir res -o "$stage/resources.zip"
          "$tools/aapt2" link -I "$android" --manifest AndroidManifest.xml \
            --version-code "$version" --version-name "0.$version" --replace-version \
            -o "$stage/base.apk" "$stage/resources.zip"
          javac -encoding UTF-8 --release 8 -classpath "$android" -d "$stage/classes" FlightActivity.java
          jar cf "$stage/classes.jar" -C "$stage/classes" .
          "$tools/d8" --min-api 30 --lib "$android" --output "$stage" "$stage/classes.jar"
          jar uf "$stage/base.apk" -C "$stage" classes.dex
          "$tools/zipalign" -f 4 "$stage/base.apk" "$stage/aligned.apk"
          "$tools/apksigner" sign --ks "$stage/signing.jks" --ks-pass pass:android \
            --out ParaVario.apk "$stage/aligned.apk"
          "$tools/apksigner" verify ParaVario.apk
      - name: Publier sur GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.$((GITHUB_RUN_NUMBER + 1))"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ParaVario.apk --clobber
          else
            gh release create "$tag" ParaVario.apk --target "$GITHUB_SHA" \
              --title "ParaVario $tag" --generate-notes
          fi
